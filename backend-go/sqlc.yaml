version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/platform/jobs/queries
    gen:
      go:
        package: jobsql
        out: internal/platform/jobs/jobsql
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type: string
  - engine: postgresql
    schema: migrations
    queries: internal/modules/navigation/queries
    gen:
      go:
        package: navigationsql
        out: internal/modules/navigation/navigationsql
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/modules/detection/queries
    gen:
      go:
        package: detectionsql
        out: internal/modules/detection/detectionsql
        sql_package: pgx/v5
        omit_unused_structs: true
